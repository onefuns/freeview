function status(t,c='blue'){return `<span class="status s-${c}">${t}</span>`}
function rating(v,count=''){const full=Math.max(0,Math.min(5,Math.round(v)));return `<span class="rating-stars" aria-label="별점 ${v}점">${'★'.repeat(full)}${'☆'.repeat(5-full)}</span><span class="rating-score">${v}${count?` · ${count}`:''}</span>`}
function pageHead(title,sub='',buttons=''){return `<div class="page-head"><h1>${title}</h1><span class="sub">${sub}</span><div class="actions">${buttons}</div></div>`}
function search(fields){return `<div class="panel legacy-search"><div class="panel-title">검색 조건</div><div class="panel-body"><div class="search-grid">${fields}<div class="search-buttons"><button class="btn primary" onclick="toast('검색했습니다. (프리뷰)')">검색</button><button class="btn" onclick="toast('검색조건을 초기화했습니다.')">초기화</button></div></div></div></div>`}
function field(label,control,cls=''){return `<div class="field ${cls}"><label>${label}</label>${control}</div>`}
function input(ph=''){return `<input placeholder="${ph}">`}
function select(opts){return `<select>${opts.map(x=>`<option>${x}</option>`).join('')}</select>`}
function dates(label='신청일'){return field(label+' 시작','<input value="2026-10-01">')+field(label+' 종료','<input value="2026-10-26">')}
function table(headers,rows){return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((v,i)=>`<td class="${i===0?'':'left'}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function check(){return '<input type="checkbox">'}
function btn(label,kind){return `<button class="btn sm" onclick="openForm('${kind}')">${label}</button>`}

function renderNav(){document.getElementById('sideTitle').textContent=state.role==='agency'?'대리점 메뉴':state.role==='seller'?'판매점 메뉴':'영업점 메뉴';document.getElementById('orgName').textContent=roleNames[state.role];document.getElementById('nav').innerHTML=menus[state.role].map(g=>`<div class="group"><div class="group-title">${g.g}</div>${g.i.map(m=>`<button class="nav-btn ${state.page===m[0]?'active':''} ${m[2]||''}" onclick="go('${m[0]}')">${m[1]}</button>`).join('')}</div>`).join('')}
function go(page){state.page=page;renderNav();renderPage();if(window.innerWidth<900)document.getElementById('shell')?.classList.add('nav-collapsed');syncNavToggle()}
function syncNavToggle(){const shell=document.getElementById('shell'),button=document.getElementById('navToggle'),label=document.getElementById('navToggleLabel');const collapsed=shell.classList.contains('nav-collapsed');if(label)label.textContent=collapsed?'메뉴 펼치기':'메뉴 접기';if(button){button.setAttribute('aria-expanded',String(!collapsed));button.setAttribute('aria-label',collapsed?'좌측 메뉴 펼치기':'좌측 메뉴 접기');button.title=collapsed?'좌측 메뉴 펼치기':'좌측 메뉴 접기'}}
function toggleNav(){const shell=document.getElementById('shell');shell.classList.toggle('nav-collapsed');try{localStorage.setItem('routerAdminNavCollapsed',shell.classList.contains('nav-collapsed')?'1':'0')}catch(e){}syncNavToggle()}

 ,excelCharge:['충전내역 엑셀 다운로드 양식',`<div class="section-label">목록의 복합 표시값을 엑셀에서는 아래 컬럼으로 분리</div><div class="field full"><div class="excel-columns">${['순번','판매점','영업점','CTN','USIM Serial','Model','S/N-SSID-PASS','통신사','요금제','요금제 가격','고객명','연락처','충전 요청일','충전일','충전시각','만료일','충전상태','판매조건','메모'].map(x=>`<span>${x}</span>`).join('')}</div></div><div class="form-help">한 셀에 두 값을 합치지 않고 각 값별 독립 컬럼으로 내보냅니다.</div>`]
};

forms.order=['신규 주문',`${field('주문 요청일','<input type="date" value="2026-10-28">','full')}${field('주문 내용','<textarea id="orderText" style="height:150px" placeholder="예: 테스트 주문 : KT / 5G500 / 1대&#10;서울시 용산구 한남동 6530-1 나주옥&#10;010-5555-6666 김성진"></textarea>','full')}`];

forms.adminOrder=['신규 주문',`${field('신청 구분','<label><input type="radio" checked> 신규</label> <label><input type="radio"> 충전</label>')}${field('주문 요청일','<input type="date" value="2026-10-28">')}${field('CTN','<input placeholder="CTN">')}${field('CTN 매칭','<button class="btn">CTN 매칭하기</button>')}${field('판매점',select(['DAS 판매점','서초 판매점']))}${field('영업점',select(['선택안함','강남 영업점','잠실 영업점']))}${field('신청 경로',select(['사이트','카톡/텔레','문자','전화','스토어','고도몰','쿠팡']))}${field('1개월 요금제',select(['요금제 선택','5GCA200','KT5G30-165','KTR-C-85','KT30MCSIM']))}${field('주문 내용','<textarea style="height:150px" placeholder="통신사, 모델, 수량, 수령인, 연락처, 주소를 자유롭게 입력"></textarea>','full')}`];
function accountForm(title){const orgLabel=title==='영업점'?'영업점명 *':'이름 / 조직명 *';const member=title==='영업점'?'<input value="영업점" readonly>':select(['관리자','판매점','영업점','통신사']);return [`${title==='영업점'?'영업점 개설·수정':title+' 등록·수정'}`,`<div class="section-label">로그인 정보</div>${field('아이디 *','<input placeholder="로그인 아이디">')}${field('비밀번호 *','<input type="password" placeholder="8자 이상 입력">')}<div class="section-label">기본 정보</div>${field(orgLabel,'<input placeholder="조직 또는 사용자 이름">')}${field('대표자명','<input placeholder="대표자명">')}${field('연락처','<input placeholder="010-0000-0000">')}${field('이메일','<input type="email" placeholder="name@example.com">')}<div class="section-label">운영 설정</div>${field('회원유형',member)}${field('상태',select(['정상','사용중지']))}${field('시작페이지',select(['판매현황','신규 주문 진행','충전 주문 요청','충전내역 및 예약현황','정산 정보','재고 현황']))}<div class="field full"><label>메뉴 권한</label><div class="permission-grid"><label><input type="checkbox" checked> 판매현황</label><label><input type="checkbox" checked> 신규주문</label><label><input type="checkbox" checked> 충전주문</label><label><input type="checkbox" checked> 충전내역</label><label><input type="checkbox" checked> 정산</label><label><input type="checkbox" checked> 재고현황</label><label><input type="checkbox" checked> 게시판</label><label><input type="checkbox" checked> 쇼핑몰관리</label></div></div><div class="form-help">필수항목과 메뉴 권한만 확인하면 등록할 수 있도록 기존 입력 순서를 유지했습니다.</div>`]}
function openForm(kind){state.activeForm=kind;let f=forms[kind];if(['users','sellers','carriers','dealers'].includes(kind))f=accountForm({users:'사용자',sellers:'판매점',carriers:'통신사',dealers:'영업점'}[kind]);if(!f)f=['상세 정보','<p>상세 화면 예시입니다.</p>'];const modalClass=kind==='customerMatch'?'modal customer-match-modal':kind==='storeProduct'?'modal product-editor-modal':'modal';const saveLabel=kind==='customerMatch'?'선택 고객 매칭':'저장';document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="${modalClass}"><div class="modal-head">${f[0]}<button onclick="closeModal()">×</button></div><div class="modal-body"><div class="form-grid">${f[1]}</div></div><div class="modal-foot"><button class="btn" onclick="closeModal()">취소</button> <button class="btn primary" onclick="saveForm()">${saveLabel}</button></div></div></div>`}
const rechargePlanOptions=['5GCA200','KT5G30-165','KTR-C-85','KT30MCSIM'];
let rechargePlanRows=['5GCA200'];
function rechargePlanSelect(value,index){return `<select aria-label="${index+1}개월 요금제" onchange="setRechargePlan(${index},this.value)">${rechargePlanOptions.map(plan=>`<option ${plan===value?'selected':''}>${plan}</option>`).join('')}</select>`}
function renderRechargeRows(){const root=document.getElementById('rechargeRows');if(!root)return;root.innerHTML=rechargePlanRows.map((plan,index)=>`<div class="recharge-row"><label>${index+1}개월 요금제</label><div class="recharge-line">${rechargePlanSelect(plan,index)}<button type="button" class="btn add-plan" onclick="addRechargeRow(${index})">추가</button><button type="button" class="btn remove-plan" onclick="removeRechargeRow(${index})">제거</button></div></div>`).join('')}
function setRechargePlan(index,value){rechargePlanRows[index]=value}
function addRechargeRow(index){rechargePlanRows.splice(index+1,0,rechargePlanRows[index]||rechargePlanOptions[0]);renderRechargeRows()}
function removeRechargeRow(index){if(rechargePlanRows.length===1){toast('최소 1개월 요금제는 유지해야 합니다.');return}rechargePlanRows.splice(index,1);renderRechargeRows()}
function openRecharge(ctn,customer){rechargePlanRows=['5GCA200'];openForm('recharge');document.getElementById('rechargeCtn').value=ctn;renderRechargeRows()}
function openCustomerOrder(text){openForm('order');document.getElementById('orderText').value=text}
function openCustomerCancel(button){state.cancelRow=button.closest('tr');openForm('customerCancel')}
function openCustomerMatch(orderNo){openForm('customerMatch');const field=document.getElementById('matchOrderNo');if(field)field.textContent=orderNo}
function selectMatchCustomer(row){document.querySelectorAll('.match-customer-table tbody tr').forEach(x=>x.classList.remove('selected'));row.classList.add('selected');const radio=row.querySelector('input[type=radio]');if(radio)radio.checked=true}
function openSaleByCtn(ctn){state.page='saleManage';renderNav();renderPage();toast(ctn+' 판매관리 상세로 이동했습니다.')}
function selectSale(ctn){toast(ctn+' 판매 상세를 선택했습니다. (프리뷰)')}
function selectMasterCode(code,name){const title=document.getElementById('selectedMasterTitle');if(title)title.textContent=code+' '+name+' 서브 코드';toast(code+' 마스터 코드를 선택했습니다.')}
function openExcelSample(type){openForm(type==='sale'?'excelSale':'excelCharge')}
function formatEditor(command,editorId='boardEditor',value=null){const editor=document.getElementById(editorId);if(editor)editor.focus();if(command==='createLink'){const url=window.prompt('링크 주소를 입력하세요.');if(url)document.execCommand(command,false,url);return}document.execCommand(command,false,value)}
function insertEditorImages(input,editorId){const editor=document.getElementById(editorId);if(!editor||!input.files?.length)return;[...input.files].forEach(file=>{const reader=new FileReader();reader.onload=()=>{editor.focus();document.execCommand('insertImage',false,reader.result)};reader.readAsDataURL(file)});input.value=''}
function moveOrder(direction){toast('노출 순서를 '+direction+'로 이동했습니다. (프리뷰)')}
function saveForm(){if(state.activeForm==='customerCancel'&&state.cancelRow){const orderState=state.cancelRow.querySelector('.customer-order-state');const paymentState=state.cancelRow.querySelector('.customer-payment-state');const manualState=state.cancelRow.querySelector('.customer-manual-state');const actions=state.cancelRow.querySelector('.customer-order-actions');if(orderState)orderState.innerHTML=status('주문취소','red');if(paymentState)paymentState.innerHTML=status('환불대기','orange');if(manualState)manualState.innerHTML=status('접수차단','gray');if(actions)actions.innerHTML='<button class="btn sm" onclick="openForm(\'customerOrder\')">주문 보기</button>';state.cancelRow=null;closeModal();toast('고객 주문을 주문취소·환불대기로 변경했습니다.');return}if(state.activeForm==='customerMatch'){closeModal();toast('신규주문과 자기 고객계정을 매칭했습니다.');return}closeModal();toast('저장했습니다. (프리뷰)')}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t.timer);t.timer=setTimeout(()=>t.classList.remove('on'),2200)}
function sumSettle(){const s=[...document.querySelectorAll('.settle:checked')].reduce((n,x)=>n+Number(x.dataset.amt),0);const e=document.getElementById('selectedSum');if(e)e.textContent=s.toLocaleString('ko-KR')+'원'}
function settle(st){const n=document.querySelectorAll('.settle:checked').length;toast(n?`${n}건을 ${st} 처리했습니다. (프리뷰)`:'처리할 주문 건을 선택하세요.')}
document.getElementById('role').onchange=e=>{state.role=e.target.value;state.page=state.role==='agency'?'stock':'home';renderNav();renderPage();syncNavToggle();toast(roleNames[state.role]+' 화면으로 전환했습니다.')};
let savedNavState=null;try{savedNavState=localStorage.getItem('routerAdminNavCollapsed')}catch(e){}if(savedNavState==='1'||(savedNavState===null&&window.innerWidth<900))document.getElementById('shell')?.classList.add('nav-collapsed');if(savedNavState==='0')document.getElementById('shell')?.classList.remove('nav-collapsed');syncNavToggle();
renderNav();renderPage();
</script>
