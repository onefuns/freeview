    home=storefrontHome;
    function currentSlides(){return [{kicker:'ROUTER GUIDE',title:'휴대용 Wi-Fi,<br>쉽게 시작하세요',desc:'전원을 켜고 연결하면 휴대폰·노트북에서 데이터를 함께 사용할 수 있어요.',cta:'사용법 보기',route:'#/guide'},{kicker:'CHOOSE EASY',title:'사용 인원에 맞게<br>구성만 고르세요',desc:'복잡한 통신 용어 대신 이용 목적과 데이터 사용량으로 비교합니다.',cta:'상품 비교',route:'#/shop'},{kicker:'MY DEVICE',title:'사용 중에도<br>기간을 바로 연장',desc:'등록된 나의 장비에서 만료일을 확인하고 필요한 기간을 충전하세요.',cta:'나의 장비',route:'#/my'}]}

    function guideLayout(){const t=tenantCfg(),p=product(t.featured),s=currentSlides()[heroSlide];return `<section class="screen guide-home"><span class="layout-label">GUIDE MAGAZINE</span><h1 class="guide-lead">처음 보는 장비도<br>이해하고 고를 수 있게</h1><p class="guide-intro">${t.name}의 설명 중심 쇼핑몰입니다. 상품보다 사용 방법과 선택 기준을 먼저 안내합니다.</p><section class="hero" data-slide="${heroSlide}"><span class="hero-device" aria-hidden="true"></span><div class="hero-content"><span class="hero-kicker">${s.kicker}</span><h1>${s.title}</h1><p>${s.desc}</p><div class="hero-actions"><button class="btn" data-go="${s.route}">${s.cta}</button><button class="btn btn-quiet" data-go="#/support">상담하기</button></div></div>${slidePager()}</section><section class="section editorial-card"><span class="guide-label">라우터를 한 문장으로</span><blockquote>“여러 기기가 함께 쓰는<br>휴대용 Wi-Fi 공유기예요.”</blockquote><p>SIM과 데이터가 설정된 장비를 받아 전원을 켜면 됩니다. 어려운 설정은 담당자가 준비합니다.</p></section><section class="section beginner-guide"><span class="guide-label">어떻게 사용할 예정인가요?</span><h2>목적을 선택하면 추천 상품으로 이동해요</h2><div class="need-grid"><button class="need-card" data-shop-filter="5G"><span>${svg('signal',17)}</span><strong>영상·업무가 많아요</strong><small>5G 고속 상품</small></button><button class="need-card" data-shop-filter="LTE"><span>${svg('wifi',17)}</span><strong>가볍게 여행해요</strong><small>LTE 휴대형</small></button><button class="need-card" data-shop-filter="SIM"><span>${svg('sim',17)}</span><strong>SIM만 필요해요</strong><small>내 장비에 사용</small></button><button class="need-card" data-shop-filter="ALL"><span>${svg('shop',17)}</span><strong>전체를 비교할래요</strong><small>모든 상품</small></button></div></section><section class="section"><div class="section-head"><h2 class="section-title">추천 장비를 하나만 본다면</h2></div><article class="featured" data-product="${p.id}" tabindex="0">${visual(p)}<div class="featured-copy"><span class="product-type">BEGINNER PICK</span><h3 class="product-name">${pname(p)}</h3><p class="product-desc">${p.desc}</p><div class="rating-line">★ 4.8 <small>리뷰 24</small></div><div class="product-price">${money(p.device+p.plans[0][1])} <small>부터</small></div></div></article></section><section class="section"><div class="section-head"><h2 class="section-title">받은 뒤 3단계</h2></div><div class="steps"><div class="step"><span class="step-num">1</span><div><strong>전원을 켜기</strong><p>버튼을 3초간 눌러요.</p></div></div><div class="step"><span class="step-num">2</span><div><strong>Wi-Fi 이름 확인</strong><p>장비 화면이나 라벨을 확인해요.</p></div></div><div class="step"><span class="step-num">3</span><div><strong>휴대폰에서 연결</strong><p>비밀번호를 입력하면 끝이에요.</p></div></div></div></section><section class="section support-card"><div><h3>그래도 어렵다면 상담하세요</h3><p>사용 장소와 인원만 알려주세요.</p></div><button class="icon-btn" data-go="#/support">${svg('chevron')}</button></section><p class="notice">가이드 매거진형은 설명과 교육 콘텐츠를 우선하는 템플릿입니다.</p></section>`}
    function catalogLayout(){const s=currentSlides()[heroSlide],items=products.slice(0,4);return `<section class="screen catalog-home">${heading('PRODUCT CATALOG','상품을 빠르게 비교하세요','검색과 가격 비교를 우선하는 쇼핑몰형 레이아웃입니다.')}<div class="catalog-top"><button class="catalog-search" data-go="#/shop">${svg('search',18)}<strong>상품명, 용도, 데이터로 검색</strong></button><div class="catalog-pills"><button class="catalog-pill active" data-shop-filter="ALL">전체</button><button class="catalog-pill" data-shop-filter="5G">5G 고속</button><button class="catalog-pill" data-shop-filter="LTE">LTE 휴대형</button><button class="catalog-pill" data-shop-filter="SIM">데이터 SIM</button></div></div><section class="catalog-banner"><span class="product-type" style="color:#fff">${s.kicker}</span><h2>${s.title}</h2><p>${s.desc}</p>${slidePager()}</section><div class="catalog-section-title"><h2>많이 찾는 상품</h2><span>${products.length}개 상품</span></div><div class="product-grid">${items.map(productCard).join('')}</div><button class="btn btn-primary btn-block section" data-go="#/shop">전체 상품과 가격 비교</button><div class="catalog-section-title"><h2>한눈에 비교</h2><span>선택 기준</span></div><section class="compare-card"><div class="compare-row head"><strong>구분</strong><span>5G</span><span>LTE</span><span>SIM</span></div><div class="compare-row"><strong>추천 용도</strong><span>업무</span><span>여행</span><span>개인</span></div><div class="compare-row"><strong>장비 포함</strong><span>포함</span><span>포함</span><span>없음</span></div><div class="compare-row"><strong>연결 기기</strong><span>많음</span><span>보통</span><span>1대</span></div></section><section class="section trust-row"><div class="trust-item"><span>${svg('truck',20)}</span><strong>배송 확인</strong></div><div class="trust-item"><span>${svg('message',20)}</span><strong>상품 문의</strong></div><div class="trust-item"><span>${svg('refresh',20)}</span><strong>기간 연장</strong></div></section><p class="notice">상품 카탈로그형은 검색·가격·비교를 우선하는 템플릿입니다.</p></section>`}
    function promoLayout(){const t=tenantCfg(),p=product(t.featured),s=currentSlides()[heroSlide];return `<section class="screen promo-home"><section class="campaign-hero" data-slide="${heroSlide}"><div class="campaign-copy"><span class="campaign-tag">${s.kicker} · ${t.tag}</span><h1>${s.title}</h1><p>${s.desc}</p><div class="campaign-price"><strong>${money(p.device+p.plans[0][1])}</strong><span>추천 구성부터</span></div><button class="btn" data-go="${s.route}">${s.cta}</button></div>${slidePager()}</section><div class="promo-section promo-strip"><article class="promo-tile accent"><span>FIRST ROUTER</span><h3>처음이라면<br>상담부터</h3><p>사용 장소와 인원만 알려주세요.</p></article><article class="promo-tile"><span>QUICK GUIDE</span><h3>전원 켜고<br>바로 연결</h3><p>설정된 장비를 받아 간편하게 사용해요.</p></article></div><section class="promo-section section"><span class="layout-label">CAMPAIGN PICK</span><article class="spotlight" data-product="${p.id}" tabindex="0">${visual(p)}<span class="product-type">이번 캠페인 추천</span><h2>${pname(p)}</h2><p>${p.desc}. 여러 기기를 연결하는 고객에게 추천하는 프리뷰 구성입니다.</p><div class="rating-line">★ 4.8 <small>한 줄 리뷰 24</small></div><div class="product-price">${money(p.device+p.plans[0][1])} <small>부터</small></div><button class="btn btn-primary btn-block" style="margin-top:16px" data-go="#/product/${p.id}">추천 구성 보기</button></article></section><section class="promo-section section micro-banner"><span>LIMITED MESSAGE</span><h3>필요한 기간만 선택하고<br>나의 장비에서 간편 연장</h3><p>구매 이후에도 같은 쇼핑몰에서 장비와 사용 기간을 관리할 수 있어요.</p></section><section class="promo-section section"><div class="section-head"><h2 class="section-title">실제 사용이 궁금하다면</h2><button class="text-link" data-go="#/reviews">리뷰 전체 보기</button></div><div class="review-card"><span class="stars">★★★★★</span><p>“${previewReviews[1].text}”</p><small>${previewReviews[1].author}</small></div></section><section class="promo-section section button-row"><button class="btn btn-secondary" data-go="#/guide">사용 가이드</button><button class="btn btn-primary" data-go="#/support">1     function socialProofSection(full=false){const list=full?previewReviews:previewReviews.slice(0,2);return `<section class="social-proof"><div class="social-review-head"><h2>구매 고객 리뷰</h2>${full?'':`<button data-go="#/reviews">전체보기 ${svg('chevron',13)}</button>`}</div><div class="social-score"><div class="score-main"><strong>4.8</strong><span class="stars">★★★★★</span><small>리뷰 42개</small></div><div class="score-bars">${[[5,82],[4,13],[3,5],[2,0],[1,0]].map(x=>`<div class="score-row"><span>${x[0]}점</span><i class="score-track"><span style="--w:${x[1]}%"></span></i><b>${x[1]}%</b></div>`).join('')}</div></div><div class="review-keywords"><button class="review-keyword active">전체 42</button><button class="review-keyword">쉬운 사용 18</button><button class="review-keyword">빠른 연결 14</button><button class="review-keyword">배송 만족 10</button></div><div class="social-review-list">${list.map((r,i)=>`<article class="social-review"><div class="review-meta"><span class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</span><span class="verified">구매인증</span></div><p>${r.text}</p><span class="review-option">${i===1?'데이터 3개월 연장':'MXR5Gax · 15GB 구성'}</span><div class="review-footer"><small>${i===0?'tra*** · 2026.11.08':i===1?'rou*** · 2026.11.03':'wifi*** · 2026.10.29'}</small><button class="helpful">도움돼요 ${i+2}</button></div></article>`).join('')}</div>${full?'':`<button class="review-more" data-go="#/reviews">리뷰 42개 모두 보기</button>`}</section>`}
    const redesignedHomeBase=home;function storefrontHomeWithReviews(){const html=redesignedHomeBase(),at=html.lastIndexOf('</section>');return html.slice(0,at)+socialProofSection()+html.slice(at)}home=storefrontHomeWithReviews;

    function notFound(){return `<section class="screen">${heading('404','페이지를 찾을 수 없어요')}${empty('알 수 없는 주소예요','메뉴에서 원하는 화면으로 다시 이동하세요.','홈으로','#/')}</section>`}
    function bindRechargePaymentPolicy(){const rechargeBtn=app.querySelector('[data-recharge-submit]');if(!rechargeBtn)return;rechargeBtn.onclick=()=>{rechargeBtn.disabled=true;const st=app.querySelector('#rechargeStatus'),payment=app.querySelector('input[name=rechargePayment]:checked')?.value||'';st.textContent='결제수단과 요청 상태를 확인하고 있습니다…';setTimeout(()=>{const completed=payment==='Telegram Stars';st.textContent=completed?'시연 결제완료 이벤트를 확인해 충전요청 1건을 생성했습니다.':payment.includes('상담결제')?'상담 결제요청을 생성했습니다. 판매자 확인 전에는 충전요청이 만들어지지 않습니다.':'온체인 확인중입니다. 최종 확인 전에는 충전요청이 만들어지지 않습니다.';st.className=`status-message ${completed?'success':''}`;rechargeBtn.disabled=false},800)}}
    function render(){updateChrome();window.scrollTo(0,0);clearInterval(heroTimer);const hash=location.hash||'#/',parts=hash.slice(2).split('/').filter(Boolean);if(hash==='#/')app.innerHTML=home();else if(parts[0]==='shop')app.innerHTML=shop();else if(parts[0]==='product')app.innerHTML=productDetail(parts[1]);else if(parts[0]==='cart')app.innerHTML=cartPage();else if(parts[0]==='checkout')app.innerHTML=checkout();else if(parts[0]==='order-complete')app.innerHTML=complete(parts[1]);else if(parts[0]==='my'&&!parts[1])app.innerHTML=my();else if(parts[0]==='my'&&parts[1]==='orders')app.innerHTML=orderList();else if(parts[0]==='my'&&parts[1]==='devices'&&!parts[2])app.innerHTML=deviceList();else if(parts[0]==='my'&&parts[1]==='devices')app.innerHTML=deviceDetail(parts[2]);else if(parts[0]==='my'&&parts[1]==='recharge')app.innerHTML=recharge(parts[2]);else if(parts[0]==='reviews')app.innerHTML=reviewsPage();else if(parts[0]==='notices')app.innerHTML=accordions('공지사항','시연용 운영 안내를 확인하세요.',notices);else if(parts[0]==='guide')app.innerHTML=accordions('사용 가이드','샘플 가이드이며 실제 기기의 사용 설명서를 대체하지 않습니다.',guides);else if(parts[0]==='support')app.innerHTML=support();else app.innerHTML=notFound();bindPage();bindRechargePaymentPolicy();updateNav();if(hash==='#/')heroTimer=setInterval(()=>{heroSlide=(heroSlide+1)%3;render()},5200)}
    function bindPage(){app.querySelectorAll('[data-go]').forEach(el=>el.addEventListener('click',()=>go(el.dataset.go)));app.querySelectorAll('[data-back]').forEach(el=>el.addEventListener('click',()=>back()));app.querySelectorAll('[data-product]').forEach(el=>{const open=()=>go(`#/product/${el.dataset.product}`);el.addEventListener('click',open);el.addEventListener('keydown',e=>{if(e.key==='Enter')open()})});app.querySelectorAll('[data-shop-filter]').forEach(el=>el.addEventListener('click',()=>{shopState.filter=el.dataset.shopFilter;go('#/shop')}));app.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',()=>{shopState.filter=el.dataset.filter;render()}));const search=app.querySelector('#shopSearch');if(search){search.value=shopState.q;search.addEventListener('input',e=>{shopState.q=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render();const next=app.querySelector('#shopSearch');if(next){next.focus();next.setSelectionRange(next.value.length,next.value.length)}},250)})}const sort=app.querySelector('#sortProducts');if(sort)sort.addEventListener('change',e=>{shopState.sort=e.target.value;render()});app.querySelectorAll('[data-plan]').forEach(el=>el.addEventListener('click',()=>{const id=(location.hash.split('/')[2]);sessionStorage.setItem('preview-plan-'+id,el.dataset.plan);render()}));app.querySelectorAll('[data-qty]').forEach(el=>el.addEventListener('click',()=>{const id=location.hash.split('/')[2],cur=Math.max(1,Number(sessionStorage.getItem('preview-qty-'+id)||1)+Number(el.dataset.qty));sessionStorage.setItem('preview-qty-'+id,cur);render()}));const add=app.querySelector('[data-add-cart]'),buy=app.querySelector('[data-buy-now]');if(add)add.onclick=()=>addItem(location.hash.split('/')[2]);if(buy)buy.onclick=()=>addItem(location.hash.split('/')[2],true);app.querySelectorAll('[data-cart-qty]').forEach(el=>el.onclick=()=>{const items=cart(),i=Number(el.dataset.index);items[i].qty=Math.max(1,items[i].qty+Number(el.dataset.cartQty));saveCart(items);render()});app.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{const items=cart();items.splice(Number(el.dataset.remove),1);saveCart(items);render()});const form=app.querySelector('#checkoutForm');if(form){const draft=checkoutDraft();form.receiver.value=draft.receiver;form.phone.value=draft.phone;form.address.value=draft.address;form.querySelectorAll('input[name=delivery]').forEach(el=>el.onchange=()=>{const next={delivery:el.value,receiver:form.receiver.value,phone:form.phone.value,address:form.address.value};sessionStorage.setItem('preview-checkout-draft',JSON.stringify(next));render()});form.onsubmit=e=>placeOrder(e,form)}app.querySelectorAll('[data-order-filter]').forEach(el=>el.onclick=()=>{sessionStorage.setItem('preview-order-filter',el.dataset.orderFilter);render()});app.querySelectorAll('[data-order-expand]').forEach(el=>el.onclick=()=>el.querySelector('.order-extra').classList.toggle('hidden'));const sim=app.querySelector('[data-sim-reissue]');if(sim)sim.onclick=()=>showModal('SIM 재발급 신청','실제 재발급은 진행되지 않는 시연입니다. 신청 완료 피드백을 확인하시겠어요?','시연 신청',()=>showToast('시연 신청이 완료됐습니다.'));app.querySelectorAll('[data-recharge-plan]').forEach(el=>el.onclick=()=>{sessionStorage.setItem('preview-recharge',el.dataset.rechargePlan);render()});const rechargeBtn=app.querySelector('[data-recharge-submit]');if(rechargeBtn)rechargeBtn.onclick=()=>{rechargeBtn.disabled=true;const st=app.querySelector('#rechargeStatus');st.textContent='시연 충전을 처리하고 있습니다…';setTimeout(()=>{st.textContent='시연 충전이 완료됐습니다. 실제 데이터는 변경되지 않았습니다.';st.className='status-message success';rechargeBtn.disabled=false},800)};const contact=app.querySelector('[data-contact]');if(contact)contact.onclick=()=>showModal('상담 계정 미설정','이 프리뷰에는 실제 Telegram 상담 계정이 연결되어 있지 않습니다.','확인')}
    const bindPageBase=bindPage;bindPage=function(){bindPageBase();app.querySelectorAll('[data-hero-slide]').forEach(el=>el.onclick=()=>{heroSlide=Number(el.dataset.heroSlide);render()})};
    function placeOrder(e,form){e.preventDefault();if(checkoutBusy)return;const st=form.querySelector('#checkoutStatus'),fd=new FormData(form),receiver=String(fd.get('receiver')||'').trim(),phone=String(fd.get('phone')||'').trim(),address=String(fd.get('address')||'').trim(),items=cart();if(!items.length){st.textContent='장바구니가 비어 있어 주문할 수 없습니다.';st.className='status-message error';return}if(!receiver||!phone||!address){st.textContent='이름, 연락처, 수령 정보를 모두 입력해주세요.';st.className='status-message error';return}const payment=String(fd.get('payment')||'');if(!allowedPayments(items).includes(payment)){st.textContent='현재 채널에서 허용되지 않는 결제수단입니다.';st.className='status-message error';return}checkoutBusy=true;const btn=form.querySelector('[type=submit]');btn.disabled=true;btn.textContent='시연 결제요청 생성 중…';st.textContent='허용 결제수단을 다시 검증하고 있습니다.';setTimeout(()=>{const delivery=String(fd.get('delivery')),fee=delivery==='오늘 바로'?3000:0,total=items.reduce((s,x)=>s+(product(x.productId).device+x.planPrice)*x.qty,0)+fee,id=`RW-${Date.now().toString().slice(-8)}`,paymentStatus=payment.includes('상담결제')?'결제대기':payment==='Telegram Stars'?'결제완료':'확인중',o={id,tenant,channel,items:JSON.parse(JSON.stringify(items)),delivery,payment,paymentStatus,total,createdAt:new Date().toISOString(),demo:true};saveOrders([o,...orders()]);saveCart([]);sessionStorage.removeItem('preview-checkout-draft');checkoutBusy=false;go(`#/order-complete/${id}`)},800)}
    document.getElementById('cartButton').onclick=()=>go('#/cart');document.querySelectorAll('.nav-item').forEach(b=>b.onclick=()=>go(b.dataset.route));document.getElementById('devToggle').onclick=()=>{const d=document.getElementById('devControl');d.classList.toggle('open');document.getElementById('devToggle').setAttribute('aria-expanded',d.classList.contains('open'))};document.getElementById('tenantSelect').onchange=e=>{tenant=e.target.value;store.set('tenant',tenant);render();showToast(`${tenantCfg().name} 프리뷰로 전환했습니다.`)};document.getElementById('channelSelect').onchange=e=>{channel=e.target.value;store.set('channel',channel);render();showToast(`${channel==='telegram'?'Telegram Mini App':'독립 웹 쇼핑몰'} 결제정책을 적용했습니다.`)};document.getElementById('themeSelect').onchange=e=>{theme=e.target.value;store.set('theme',theme);render();showToast(`${theme==='dark'?'다크':'라이트'} 테마를 적용했습니다.`)};document.getElementById('templateSelect').onchange=e=>{template=e.target.value;store.set('template',template);render();showToast('레이아웃 템플릿을 변경했습니다.')};document.getElementById('colorSelect').onchange=e=>{colorSet=e.target.value;store.set('colorSet',colorSet);render();showToast('컬러셋을 변경했습니다.')};document.getElementById('resetDemo').onclick=()=>showModal('시연 데이터 초기화','장바구니, 주문, 판매점, 채널, 템플릿과 컬러 설정을 모두 초기화합니다.','초기화',()=>{try{Object.keys(localStorage).filter(k=>k.startsWith('roam-html-preview-')).forEach(k=>localStorage.removeItem(k))}catch(e){}memory={};tenant='alpha';channel='telegram';theme='light';template='guide';colorSet='brand';heroSlide=0;sessionStorage.clear();render();showToast('시연 데이터를 초기화했습니다.')});window.addEventListener('hashchange',render);updateChrome();if(!location.hash)location.hash='#/';else render();
  })();
