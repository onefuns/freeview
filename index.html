<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071d2d">
  <meta name="description" content="eSIMglocal 레퍼럴 관리자 및 마케터 포털 프리뷰">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2329aae1'/%3E%3Cpath d='M7 16h18M16 7c4 4 4 14 0 18M16 7c-4 4-4 14 0 18M9 10h14M9 22h14' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>eSIMglocal Referral Portal Preview</title>
  <style>
    :root {
      --navy: #071d2d;
      --navy-2: #0c2a3e;
      --blue: #20a7e2;
      --blue-deep: #087cb3;
      --cyan-soft: #e9f8ff;
      --ink: #132635;
      --muted: #647686;
      --line: #dfe7ec;
      --surface: #ffffff;
      --canvas: #f4f7f9;
      --green: #1d9d67;
      --green-soft: #eaf8f1;
      --amber: #c97a14;
      --amber-soft: #fff5e3;
      --red: #c94343;
      --red-soft: #fff0f0;
      --purple: #6d5bd0;
      --shadow: 0 14px 35px rgba(16, 45, 65, .08);
      --radius: 18px;
      font-family: Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--canvas);
    }

    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--canvas); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(32, 167, 226, .25);
      outline-offset: 2px;
    }

    .app { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); }
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px 18px;
      color: white;
      background:
        radial-gradient(circle at 30% 0%, rgba(32,167,226,.26), transparent 34%),
        linear-gradient(180deg, var(--navy-2), var(--navy));
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 2px 8px 24px; }
    .brand-mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--blue); box-shadow: 0 8px 20px rgba(32,167,226,.25); }
    .brand strong { display: block; font-size: 1.02rem; letter-spacing: -.02em; }
    .brand small { display: block; margin-top: 2px; color: #a9c3d4; font-size: .72rem; }

    .role-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; padding: 5px; margin: 0 4px 22px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; }
    .role-switch button { border: 0; border-radius: 9px; padding: 9px 8px; color: #a9c3d4; background: transparent; font-weight: 750; font-size: .78rem; }
    .role-switch button.active { color: var(--navy); background: white; }

    .nav-label { padding: 0 12px 8px; color: #6f92a8; font-weight: 800; font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; }
    .nav { display: grid; gap: 5px; }
    .nav button { width: 100%; display: flex; align-items: center; gap: 11px; border: 0; border-radius: 12px; padding: 11px 12px; color: #b9cfdd; background: transparent; font-weight: 680; text-align: left; }
    .nav button:hover { color: white; background: rgba(255,255,255,.07); }
    .nav button.active { color: white; background: linear-gradient(90deg, rgba(32,167,226,.35), rgba(32,167,226,.12)); box-shadow: inset 3px 0 0 var(--blue); }
    .nav svg { flex: 0 0 auto; }
    .sidebar-foot { margin-top: auto; padding: 14px 10px 4px; color: #91abba; font-size: .75rem; line-height: 1.55; }
    .sync-dot { display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 999px; background: #4ad499; box-shadow: 0 0 0 4px rgba(74,212,153,.1); }

    .main { min-width: 0; }
    .topbar { height: 76px; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.92); backdrop-filter: blur(12px); }
    .topbar h1 { margin: 0; font-size: 1.25rem; letter-spacing: -.03em; }
    .topbar p { margin: 4px 0 0; color: var(--muted); font-size: .78rem; }
    .userbox { display: flex; align-items: center; gap: 10px; }
    .preview-pill { padding: 7px 10px; border-radius: 999px; color: var(--blue-deep); background: var(--cyan-soft); font-size: .72rem; font-weight: 800; }
    .avatar { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; color: white; background: var(--navy); font-weight: 850; }
    .usertext { line-height: 1.25; }
    .usertext strong { display: block; font-size: .82rem; }
    .usertext span { color: var(--muted); font-size: .7rem; }

    .content { max-width: 1440px; margin: 0 auto; padding: 28px 32px 48px; }
    .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    .page-head h2 { margin: 0; font-size: 1.55rem; letter-spacing: -.04em; }
    .page-head p { margin: 7px 0 0; color: var(--muted); font-size: .9rem; }
    .actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

    .btn { border: 1px solid var(--line); border-radius: 11px; padding: 10px 14px; color: var(--ink); background: white; font-weight: 760; font-size: .82rem; box-shadow: 0 4px 12px rgba(18,45,65,.04); }
    .btn:hover { border-color: #b9ccd8; transform: translateY(-1px); }
    .btn.primary { border-color: var(--blue); color: white; background: linear-gradient(135deg, var(--blue), #168bc4); }
    .btn.danger { color: var(--red); background: var(--red-soft); border-color: #ffd1d1; }
    .btn.small { padding: 7px 10px; border-radius: 9px; font-size: .75rem; }

    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
    .metric { position: relative; overflow: hidden; min-height: 130px; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .metric::after { content: ""; position: absolute; width: 90px; height: 90px; right: -32px; top: -32px; border-radius: 50%; background: var(--tint, var(--cyan-soft)); }
    .metric .icon { position: relative; z-index: 1; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; color: var(--tone, var(--blue)); background: var(--tint, var(--cyan-soft)); }
    .metric label { display: block; margin-top: 16px; color: var(--muted); font-size: .76rem; font-weight: 720; }
    .metric strong { display: block; margin-top: 5px; font-size: 1.35rem; letter-spacing: -.04em; }
    .metric small { display: block; margin-top: 5px; color: var(--green); font-size: .72rem; font-weight: 720; }
    .metric.amber { --tone: var(--amber); --tint: var(--amber-soft); }
    .metric.green { --tone: var(--green); --tint: var(--green-soft); }
    .metric.purple { --tone: var(--purple); --tint: #f1efff; }

    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .8fr); gap: 16px; margin-top: 16px; }
    .card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .card-head { min-height: 58px; padding: 16px 18px; display: flex; align-items: center; justify-content: space-between; gap: 14px; border-bottom: 1px solid #edf1f4; }
    .card-head h3 { margin: 0; font-size: .95rem; letter-spacing: -.02em; }
    .card-head span { color: var(--muted); font-size: .72rem; }
    .card-body { padding: 18px; }
    .chart-wrap { min-height: 236px; display: flex; flex-direction: column; justify-content: space-between; }
    .chart-summary { display: flex; align-items: baseline; gap: 9px; }
    .chart-summary strong { font-size: 1.45rem; }
    .chart-summary span { color: var(--green); font-size: .75rem; font-weight: 800; }
    .chart { width: 100%; height: 150px; margin-top: 10px; overflow: visible; }
    .chart .grid { stroke: #e7edf1; stroke-width: 1; }
    .chart .area { fill: url(#areaFill); }
    .chart .line { fill: none; stroke: var(--blue); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .chart-labels { display: flex; justify-content: space-between; color: #91a0aa; font-size: .67rem; }

    .queue { display: grid; gap: 12px; }
    .queue-item { padding: 13px; border: 1px solid #edf1f4; border-radius: 13px; background: #fbfcfd; }
    .queue-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .queue-top strong { font-size: .82rem; }
    .queue-item p { margin: 5px 0 10px; color: var(--muted); font-size: .72rem; }
    .queue-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .queue-meta b { font-size: .86rem; }

    .table-card { margin-top: 16px; overflow: hidden; }
    .table-tools { padding: 13px 16px; display: flex; gap: 9px; flex-wrap: wrap; border-bottom: 1px solid #edf1f4; }
    .input, .select { min-height: 40px; border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; color: var(--ink); background: white; font-size: .8rem; }
    .input { min-width: 220px; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 780px; }
    th { padding: 11px 16px; color: #708290; background: #f8fafb; font-size: .69rem; letter-spacing: .03em; text-align: left; white-space: nowrap; }
    td { padding: 14px 16px; border-top: 1px solid #edf1f4; font-size: .78rem; vertical-align: middle; white-space: nowrap; }
    tbody tr:hover { background: #fbfdfe; }
    .namecell { display: flex; align-items: center; gap: 10px; }
    .mini-avatar { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 10px; color: var(--blue-deep); background: var(--cyan-soft); font-size: .7rem; font-weight: 850; }
    .namecell strong { display: block; font-size: .78rem; }
    .namecell small { display: block; margin-top: 3px; color: var(--muted); font-size: .67rem; }
    .status { display: inline-flex; align-items: center; gap: 5px; padding: 5px 8px; border-radius: 999px; font-size: .68rem; font-weight: 800; }
    .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .status.pending { color: var(--amber); background: var(--amber-soft); }
    .status.available, .status.active, .status.paid { color: var(--green); background: var(--green-soft); }
    .status.requested { color: var(--purple); background: #f1efff; }
    .status.rejected, .status.inactive { color: var(--red); background: var(--red-soft); }

    .referral-card { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 18px; margin-bottom: 16px; padding: 20px; color: white; border-radius: var(--radius); background: linear-gradient(135deg, #0b3046, #0c6f9b); box-shadow: 0 18px 38px rgba(7,29,45,.2); }
    .referral-card label { color: #b9d9e8; font-size: .72rem; font-weight: 760; }
    .referral-card strong { display: block; margin: 6px 0 12px; font-size: 1.1rem; word-break: break-all; }
    .rate-chip { display: inline-flex; padding: 6px 9px; border-radius: 999px; background: rgba(255,255,255,.13); font-size: .72rem; font-weight: 780; }
    .copy-btn { border: 1px solid rgba(255,255,255,.25); border-radius: 11px; padding: 11px 14px; color: white; background: rgba(255,255,255,.12); font-weight: 800; }
    .copy-btn:hover { background: rgba(255,255,255,.2); }

    .balance-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .balance-hero { padding: 24px; color: white; border-radius: var(--radius); background: linear-gradient(145deg, #087cb3, #20a7e2); box-shadow: 0 18px 38px rgba(32,167,226,.2); }
    .balance-hero label { color: #d9f2ff; font-size: .78rem; }
    .balance-hero strong { display: block; margin: 10px 0 5px; font-size: 2rem; letter-spacing: -.05em; }
    .balance-hero p { margin: 0; color: #d9f2ff; font-size: .75rem; }
    .form-card { padding: 22px; }
    .form-card h3 { margin: 0 0 17px; font-size: 1rem; }
    .field { display: grid; gap: 7px; margin-bottom: 14px; }
    .field label { color: #4e6372; font-size: .75rem; font-weight: 760; }
    .field input, .field select, .field textarea { width: 100%; min-height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px; color: var(--ink); background: white; }
    .field textarea { min-height: 84px; resize: vertical; }
    .helper { color: var(--muted); font-size: .69rem; }

    .empty-note { padding: 30px 18px; color: var(--muted); text-align: center; font-size: .82rem; }
    .hidden { display: none !important; }
    .mobile-role { display: none; }
    body.fixed-role .role-switch,
    body.fixed-role .mobile-role { display: none !important; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 40; max-width: 360px; padding: 13px 16px; border-radius: 12px; color: white; background: #173448; box-shadow: 0 14px 30px rgba(7,29,45,.25); font-size: .8rem; font-weight: 700; transform: translateY(20px); opacity: 0; pointer-events: none; transition: .22s ease; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .modal-backdrop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 20px; background: rgba(4,18,28,.58); backdrop-filter: blur(5px); }
    .modal { width: min(520px, 100%); max-height: 90vh; overflow-y: auto; border-radius: 20px; background: white; box-shadow: 0 28px 70px rgba(0,0,0,.25); }
    .modal-head { padding: 18px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
    .modal-head h3 { margin: 0; font-size: 1.05rem; }
    .icon-btn { width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: 10px; color: var(--muted); background: #f2f5f7; }
    .modal-body { padding: 20px; }
    .modal-foot { padding: 14px 20px 20px; display: flex; justify-content: flex-end; gap: 9px; }

    @media (max-width: 1050px) {
      .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dashboard-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 760px) {
      .app { display: block; }
      .sidebar { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; top: auto; height: 70px; padding: 7px 8px max(7px, env(safe-area-inset-bottom)); display: block; background: rgba(7,29,45,.97); }
      .brand, .role-switch, .nav-label, .sidebar-foot { display: none; }
      .nav { height: 100%; grid-template-columns: repeat(4, 1fr); gap: 4px; }
      .nav button { min-width: 0; padding: 5px 2px; flex-direction: column; justify-content: center; gap: 3px; border-radius: 9px; font-size: .62rem; text-align: center; }
      .nav button.active { box-shadow: inset 0 -2px 0 var(--blue); }
      .nav svg { width: 18px; height: 18px; }
      .topbar { height: auto; min-height: 68px; padding: 12px 16px; }
      .topbar h1 { font-size: 1rem; }
      .topbar p, .usertext { display: none; }
      .mobile-role { display: inline-flex; gap: 4px; padding: 3px; border: 1px solid var(--line); border-radius: 10px; background: #f3f6f8; }
      .mobile-role button { border: 0; border-radius: 7px; padding: 7px 8px; color: var(--muted); background: transparent; font-size: .68rem; font-weight: 800; }
      .mobile-role button.active { color: white; background: var(--navy); }
      .preview-pill { display: none; }
      .content { padding: 22px 14px 100px; }
      .page-head { align-items: flex-start; flex-direction: column; }
      .page-head h2 { font-size: 1.3rem; }
      .grid-4 { grid-template-columns: 1fr 1fr; gap: 10px; }
      .metric { min-height: 120px; padding: 14px; }
      .metric strong { font-size: 1.12rem; }
      .referral-card { grid-template-columns: 1fr; }
      .copy-btn { width: 100%; }
      .balance-panel { grid-template-columns: 1fr; }
      .input { min-width: 100%; flex: 1 1 100%; }
      .toast { left: 14px; right: 14px; bottom: 86px; max-width: none; }
    }
    @media (max-width: 430px) {
      .grid-4 { grid-template-columns: 1fr; }
      .metric { min-height: 108px; }
      .actions { width: 100%; }
      .actions .btn { flex: 1; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="포털 메뉴">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><path d="M3.8 12h16.4M12 3.5c3.6 3.7 3.6 13.3 0 17M12 3.5c-3.6 3.7-3.6 13.3 0 17" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </span>
        <span><strong>eSIMglocal</strong><small>Referral Portal</small></span>
      </div>

      <div class="role-switch" aria-label="프리뷰 역할 전환">
        <button class="role-button active" data-role="admin">관리자</button>
        <button class="role-button" data-role="marketer">마케터</button>
      </div>
      <div class="nav-label" id="navLabel">Administration</div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot"><span class="sync-dot"></span>Shopify 데이터 정상<br>최근 동기화 30초 전</div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div><h1 id="topTitle">Referral Admin</h1><p id="topSubtitle">판매·귀속·정산 운영 현황</p></div>
        <div class="userbox">
          <div class="mobile-role" aria-label="모바일 역할 전환">
            <button class="role-button active" data-role="admin">관리자</button>
            <button class="role-button" data-role="marketer">마케터</button>
          </div>
          <span class="preview-pill">PREVIEW DATA</span>
          <div class="avatar" id="avatar">A</div>
          <div class="usertext"><strong id="userName">Admin</strong><span id="userEmail">admin@esimglocal.com</span></div>
        </div>
      </header>
      <section class="content" id="content" aria-live="polite"></section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop hidden" id="modalBackdrop" role="presentation">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal-head"><h3 id="modalTitle">상세</h3><button class="icon-btn" id="modalClose" aria-label="닫기">×</button></header>
      <div class="modal-body" id="modalBody"></div>
      <footer class="modal-foot" id="modalFoot"></footer>
    </section>
  </div>

  <script>
    const icons = {
      overview: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>',
      people: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3"/><path d="M3.5 19c.5-4 2.4-6 5.5-6s5 2 5.5 6M16 6.5a2.5 2.5 0 0 1 0 5M16.5 14c2.4.4 3.7 2 4 5" stroke-linecap="round"/></svg>',
      orders: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5" stroke-linecap="round"/></svg>',
      payout: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2" stroke-linecap="round"/></svg>',
      link: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9.5 14.5l5-5M7.5 17.5l-1 1a3.5 3.5 0 0 1-5-5l3-3a3.5 3.5 0 0 1 5 0M16.5 6.5l1-1a3.5 3.5 0 0 1 5 5l-3 3a3.5 3.5 0 0 1-5 0" stroke-linecap="round"/></svg>'
    };

    const menus = {
      admin: [
        ['overview', '대시보드', icons.overview],
        ['marketers', '마케터 관리', icons.people],
        ['sales', '판매 내역', icons.orders],
        ['settlements', '정산 관리', icons.payout]
      ],
      marketer: [
        ['overview', '내 실적', icons.overview],
        ['customers', '귀속 고객', icons.people],
        ['sales', '판매 내역', icons.orders],
        ['withdrawal', '정산 요청', icons.payout]
      ]
    };

    const pageParams = new URLSearchParams(window.location.search);
    const requestedRole = pageParams.get('role');
    let role = requestedRole === 'marketer' ? 'marketer' : 'admin';
    let currentView = 'overview';

    if (pageParams.get('fixed') === '1') {
      document.body.classList.add('fixed-role');
    }

    const status = (text, type) => `<span class="status ${type}">${text}</span>`;
    const metric = (label, value, note, type = '') => `<article class="metric ${type}"><div class="icon">${icons[type === 'purple' ? 'payout' : type === 'green' ? 'orders' : type === 'amber' ? 'people' : 'overview']}</div><label>${label}</label><strong>${value}</strong><small>${note}</small></article>`;

    function renderNav() {
      const nav = document.getElementById('nav');
      nav.innerHTML = menus[role].map(([id, label, icon]) => `<button data-view="${id}" class="${id === currentView ? 'active' : ''}">${icon}<span>${label}</span></button>`).join('');

        body.innerHTML = '<div class="queue-item"><div class="queue-top"><strong>Global Connect</strong>' + status('요청중','requested') + '</div><p>ST-240930-03 · 42개 커미션</p><div class="queue-meta"><b>$520.00</b><span>USD · **** 4821</span></div></div><div class="field" style="margin-top:16px"><label>외부 지급 참조</label><input placeholder="송금번호 또는 메모"></div><div class="field"><label>관리자 메모</label><textarea placeholder="처리 기록을 입력하세요"></textarea></div>';
        foot.innerHTML = '<button class="btn danger" data-confirm="정산 요청을 반려했습니다.">반려</button><button class="btn primary" data-confirm="지급 완료로 처리했습니다.">지급완료</button>';
      } else if (type === 'marketer') {
        title.textContent = '마케터 상세';
        body.innerHTML = '<div class="field"><label>마케터명</label><input value="Global Connect"></div><div class="field"><label>레퍼럴 코드</label><input value="GLOBAL10" readonly></div><div class="field"><label>현재 수익쉐어 요율 (%)</label><input type="number" min="0" max="100" value="12"></div><div class="field"><label>상태</label><select><option>활성</option><option>비활성</option></select></div><span class="helper">요율 변경은 이후 주문부터 적용되며 기존 주문에는 소급되지 않습니다.</span>';
        foot.innerHTML = '<button class="btn" data-close>닫기</button><button class="btn primary" data-confirm="마케터 정보를 저장했습니다.">저장</button>';
      } else if (type === 'customer') {
        title.textContent = '고객 마킹 및 메모';
        body.innerHTML = '<div class="queue-item"><div class="queue-top"><strong>jo***@gmail.com</strong><span class="status available">VIP</span></div><p>귀속일 2026-08-11 · 누적 구매 $142.80</p></div><div class="field" style="margin-top:16px"><label>업무 태그</label><select><option>VIP</option><option>재구매</option><option>관심</option><option>신규</option></select></div><div class="field"><label>개인 메모</label><textarea>일본 장기체류 상품에 관심. 다음 여행 전 연락 예정.</textarea></div><span class="helper">메모는 본인에게만 표시되며 고객 귀속에는 영향을 주지 않습니다.</span>';

    function closeModal() { document.getElementById('modalBackdrop').classList.add('hidden'); }
    function bindModalActions() {
      document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));
      document.querySelectorAll('[data-confirm]').forEach(b => b.addEventListener('click', () => { closeModal(); showToast(b.dataset.confirm); }));
    }

    function bindActions() {
      document.querySelectorAll('[data-go]').forEach(button => button.addEventListener('click', () => { currentView = button.dataset.go; renderNav(); renderContent(); }));
      document.querySelectorAll('[data-modal]').forEach(button => button.addEventListener('click', () => openModal(button.dataset.modal)));
      const copy = document.getElementById('copyLink');
      if (copy) copy.addEventListener('click', async () => { const value = document.getElementById('referralUrl').textContent; try { await navigator.clipboard.writeText(value); showToast('추천 주소를 복사했습니다.'); } catch { showToast('추천 주소: ' + value); } });
      const search = document.getElementById('tableSearch');
      if (search) search.addEventListener('input', () => { const query = search.value.toLowerCase(); document.querySelectorAll('.search-row').forEach(row => row.classList.toggle('hidden', !row.textContent.toLowerCase().includes(query))); });
      const request = document.getElementById('requestWithdrawal');
      if (request) request.addEventListener('click', () => { const amount = Number(document.getElementById('withdrawAmount').value); if (!amount || amount <= 0) return showToast('요청 금액을 입력해주세요.'); if (amount > 1820.40) return showToast('정산 가능 금액을 초과했습니다.'); showToast(`$${amount.toFixed(2)} 정산 요청을 접수했습니다.`); document.getElementById('withdrawAmount').value = ''; });
    }

    document.querySelectorAll('.role-button').forEach(button => button.addEventListener('click', () => setRole(button.dataset.role)));
    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalBackdrop').addEventListener('click', event => { if (event.target.id === 'modalBackdrop') closeModal(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });

    setRole(role);
  </script>
